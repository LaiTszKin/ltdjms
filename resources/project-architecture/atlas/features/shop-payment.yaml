slug: shop-payment
title: Shop & Payment
story: 成員可在商店瀏覽商品，以貨幣或法幣付款購買，並使用兌換碼兌換商品。管理員可管理商品目錄與產生兌換碼。
dependsOn:
  - guild-economy
submodules:
  - slug: shop-interaction
    kind: api
    role: 商店瀏覽、搜尋、購買流程處理（含按鈕、選單、Modal 互動）
    functions:
      - name: handleShopBrowse
        in: guildId, page
        out: ShopPage (embed)
        side: io
        purpose: 瀏覽商店商品列表，支援分頁按鈕
      - name: handleProductSearch
        in: guildId, keyword, page
        out: SearchResultPage
        side: io
        purpose: ILINE 關鍵字搜尋商品
      - name: handleBuySelect
        in: productId, guildId, userId
        out: PaymentMethodSelect
        side: io
        purpose: 選擇商品後顯示付款方式選單（貨幣/法幣）
      - name: handleCurrencyPurchase
        in: productId, guildId, userId
        out: PurchaseResult
        side: tx
        purpose: 貨幣扣款購買：扣 Balance → grantReward → 通知
      - name: handleFiatPurchase
        in: productId, guildId, userId
        out: FiatOrderResult (含繳費碼)
        side: network
        purpose: 建立法幣訂單並產生 CVS 超商繳費碼
    variables:
      - name: inflightFiatOrders
        type: ConcurrentHashMap
        scope: instance
        purpose: 避免短時間內對同一商品重複建立法幣訂單（去重）」
      - name: shopPageCache
        type: Cache<ShopPage>
        scope: instance
        purpose: 商店頁面快取，減少重複查庫
    dataflow:
      - 接收 /shop 指令或按鈕事件
      - 查詢 ProductRepository 取得商品列表/搜尋結果
      - 貨幣付款：委派 CurrencyPurchaseService 驗證餘額→扣款→發放獎勵
      - 法幣付款：委派 FiatOrderService 建立 PENDING_PAYMENT 訂單並產生繳費碼
      - 回覆 Discord embed 或 DM 付款資訊
    errors:
      - name: ErrProductNotFound
        when: productId 在資料庫中不存在
        means: Ephemeral 提示商品不存在
      - name: ErrInsufficientBalancePurchase
        when: 貨幣餘額不足支付商品價格
        means: Ephemeral 提示餘額不足
  - slug: product-catalog-service
    kind: service
    role: 商品定義 CRUD、兌換碼產生與驗證、跨模組獎勵派送引擎
    functions:
      - name: createProduct
        in: guildId, name, desc, price, rewardType, rewardAmount
        out: Product
        side: tx
        purpose: 建立新商品，含貨幣/法幣雙軌定價與獎勵設定
      - name: updateProduct
        in: productId, fields...
        out: Product
        side: tx
        purpose: 更新商品欄位（名稱、價格、獎勵、護航選項）
      - name: deleteProduct
        in: productId
        out: void
        side: tx
        purpose: 軟刪除商品，連帶失效所有未使用的兌換碼
      - name: generateRedemptionCodes
        in: guildId, productId, count, quantity, expiresAt
        out: List<RedemptionCode>
        side: tx
        purpose: 批次產生 cryptographically secure 兌換碼（16 碼，去重）
      - name: redeemCode
        in: guildId, userId, code
        out: ProductRedemptionTransaction
        side: tx
        purpose: 驗證兌換碼 → markAsRedeemedIfAvailable → grantReward → 二階段原子兌換
      - name: grantReward
        in: guildId, userId, rewardType, rewardAmount
        out: Result<Unit, DomainError>
        side: tx
        purpose: 跨模組獎勵派送：Currency→BalanceAdjustmentService, TOKEN→GameTokenService
    variables:
      - name: product
        type: Product
        scope: persist
        purpose: 商品定義：名稱/描述/定價/獎勵/護航選項/軟刪除標記
      - name: redemptionCode
        type: RedemptionCode
        scope: persist
        purpose: 16 碼兌換碼：productId/expiresAt/redeemedBy/redeemedAt 狀態
      - name: productRedemptionTransaction
        type: ProductRedemptionTransaction
        scope: persist
        purpose: 兌換審計記錄（含商品名稱快照，不隨商品修改而變）
    dataflow:
      - step: 建立商品：驗證參數 → INSERT product → 發佈 ProductChangedEvent
        fn: createProduct
        writes:
          - product
      - step: 刪除商品：UPDATE product.deleted_at → RedemptionCodeRepository.invalidateByProductId → 發佈事件
        fn: deleteProduct
      - step: >-
          兌換碼兌換：驗證格式/未過期/未兌換 → markAsRedeemedIfAvailable（原子）→ grantReward → 失敗則 rollback
          clearRedeemedIfMatches
        fn: redeemCode
        writes:
          - redemptionCode
      - step: 獎勵派送：依 rewardType 分流至 currency BalanceAdjustmentService 或 gametoken GameTokenService
        fn: grantReward
    errors:
      - name: ErrCodeAlreadyRedeemed
        when: 兌換碼已被使用（redeemedBy != NULL）
        means: 回傳 DomainError，兌換流程中止
      - name: ErrCodeExpired
        when: 兌換碼已超過 expiresAt
        means: 回傳 DomainError，提示使用者過期
      - name: ErrProductDeleted
        when: 商品已被軟刪除
        means: 回傳 DomainError，無法購買或兌換
  - slug: fiat-payment-service
    kind: service
    role: ECPay 法幣付款整合、CVS 超商繳費碼、回撥 HTTP Server、付款後處理 Worker、對帳
    functions:
      - name: createFiatOnlyOrder
        in: guildId, userId, productId
        out: FiatOrderResult
        side: network
        purpose: 產生 ECPay CVS 超商繳費碼並建立 PENDING_PAYMENT 訂單
      - name: handleCallback
        in: encryptedPayload
        out: CallbackResult
        side: io
        purpose: ECPay 回撥解密與驗證，原子轉移 PENDING_PAYMENT→PAID
      - name: processPendingOrders
        in: none
        out: void
        side: tx
        purpose: Scheduler 每 10s：claim→通知買家→自動派遣→發放獎勵→mark fulfilled
    variables:
      - name: fiatOrder
        type: FiatOrder
        scope: persist
        purpose: 法幣訂單，含商品快照與處理狀態標記（fulfilled/rewarded/notified）
    dataflow:
      - step: 建立法幣訂單：驗證商品 → ECPay API 產生 CVS 繳費碼 → INSERT FiatOrder (PENDING_PAYMENT) → 回傳繳費資訊
        fn: createFiatOnlyOrder
        writes:
          - fiatOrder
      - step: >-
          ECPay 回撥：接收 POST → AES/CBC 解密 → 驗證 MerchantID/金額 → markPaidIfPending (原子
          PENDING_PAYMENT→PAID)
        fn: handleCallback
        writes:
          - fiatOrder
      - step: >-
          背景 Worker (每 10s)：claimFulfillmentProcessing → DM 通知買家 → 如需 Escort 則
          handoffFromFiatPayment → grantReward → markFulfilled
        fn: processPendingOrders
      - 對帳 Worker (每 60s)：expire 過期訂單 → 向 ECPay QueryTradeInfo 查遺漏回撥 → 如有則 markPaidIfPending
    errors:
      - name: ErrCallbackValidation
        when: ECPay 回撥 MerchantID 或金額與訂單不符
        means: 回傳 400，訂單維持 PENDING_PAYMENT，由 Reconciliation Worker 補償
      - name: ErrPaymentExpired
        when: 繳費期限已過仍未付款
        means: markExpiredIfPending，訂單終止
  - slug: shop-db
    kind: db
    role: product / fiat_order / redemption_code / product_redemption_transaction 資料表
    functions:
      - name: SELECT_product_by_guild
        in: guildId, page, pageSize
        out: List<Product>
        side: io
        purpose: 分頁查詢 guild 商品列表
      - name: INSERT_fiat_order
        in: FiatOrder
        out: orderNumber
        side: write
        purpose: 寫入法幣訂單
      - name: mark_paid_if_pending
        in: orderNumber
        out: 1 | 0
        side: tx
        purpose: 原子 PENDING_PAYMENT→PAID，WHERE status= PENDING_PAYMENT
      - name: mark_as_redeemed_if_available
        in: code, userId
        out: 1 | 0
        side: tx
        purpose: 原子鎖定兌換碼，WHERE 未兌換/未失效/未過期
    variables:
      - name: product
        type: table
        scope: persist
        purpose: 商品定義表：guild_id+name 唯一，含 RewardType/價格/護航選項
      - name: fiat_order
        type: table
        scope: persist
        purpose: 法幣訂單表：狀態機欄位（paid_at/fulfilled_at/notified_at）+ 商品快照
      - name: redemption_code
        type: table
        scope: persist
        purpose: 兌換碼表：code PK，product_id/redeemed_by/expires_at 狀態欄位
    dataflow: []
    errors:
      - name: ErrFiatOrderConcurrentClaim
        when: claimFulfillmentProcessing 回傳 0 列（已被其他 worker claim）
        means: 本次跳過，下個排程週期重試
edges:
  - id: e-sfy2u5
    from: shop-interaction
    to: product-catalog-service
    kind: call
    label: 商品查詢與購買
  - id: e-k3dm3i
    from: shop-interaction
    to: fiat-payment-service
    kind: call
    label: 建立法幣訂單
  - id: e-stzw97
    from: fiat-payment-service
    to: shop-db
    kind: call
    label: 讀寫法幣訂單
  - id: e-tf7hxu
    from: product-catalog-service
    to: shop-db
    kind: call
    label: 讀寫商品/兌換碼
  - id: e-3lkynb
    from: fiat-payment-service
    to: product-catalog-service
    kind: call
    label: 法幣付款完成後經 ProductRewardService 發放獎勵
