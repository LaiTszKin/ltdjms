slug: escort-dispatch
title: Escort Dispatch
story: 管理員可為護航人員派單，護航人員確認接單後完成服務，客戶可請求售後。支援從商店購買自動建立派遣單。
dependsOn:
  - shop-payment
submodules:
  - slug: dispatch-interaction
    kind: api
    role: 派遣面板指令、私訊流程、狀態轉換按鈕處理
    functions:
      - name: handleCreateOrder
        in: guildId, customerUserId, optionCode, assignedBy
        out: EscortDispatchOrder
        side: io
        purpose: 管理員手動建立派遣單，選擇客戶與護航選項
      - name: handleAssignEscort
        in: orderNumber, escortUserId
        out: EscortDispatchOrder
        side: io
        purpose: 指派護航人員至未分配訂單
      - name: handleConfirmOrder
        in: orderNumber, escortUserId
        out: EscortDispatchOrder
        side: io
        purpose: 護航人員確認接單（私訊按鈕）
      - name: handleCustomerConfirm
        in: orderNumber, customerUserId
        out: EscortDispatchOrder
        side: io
        purpose: 客戶確認完成或請求售後（私訊按鈕）
      - name: handleClaimAfterSales
        in: orderNumber, staffUserId
        out: EscortDispatchOrder
        side: io
        purpose: 售後人員認領處理案件
      - name: handleCloseAfterSales
        in: orderNumber, staffUserId
        out: EscortDispatchOrder
        side: io
        purpose: 售後人員關閉案件
    variables:
      - name: sessionState
        type: SessionState map
        scope: instance
        purpose: 追蹤當前使用者在派遣面板中的操作階段（選擇客戶/選項/護航人員）
      - name: orderNumberCache
        type: Map<String, EscortDispatchOrder>
        scope: call
        purpose: 當前訊息關聯的派遣訂單，用於按鈕回呼查詢
    dataflow:
      - 管理員輸入 /dispatch-panel → 顯示模式選擇（建立/指派/歷史）
      - 建立單：選擇客戶 → 選擇護航選項 → 委派 dispatch-service.createOrder → DM 通知護航
      - 生命週期按鈕：護航確認/回報完成/客戶確認/售後請求→ 委派 dispatch-service 對應方法 → 私訊下一方
    errors:
      - name: ErrOrderNotFound
        when: orderNumber 不存在
        means: Ephemeral 提示訂單不存在
      - name: ErrUnauthorizedAction
        when: 非該訂單相關人員試圖操作
        means: Ephemeral 拒絕操作
  - slug: dispatch-service
    kind: service
    role: 訂單狀態機（7 階段）、自動超時完成、跨模組 Handoff、售後人員管理、護航選項定價
    functions:
      - name: handoffFromFiatPayment
        in: productSnapshot, fiatOrder
        out: EscortDispatchOrder
        side: tx
        purpose: 法幣付款完成後自動建立護航派遣單（idempotent：檢查 findBySourceIdentity）
      - name: claimAfterSales
        in: orderNumber, staffUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 原子 claim：AFTER_SALES_REQUESTED→AFTER_SALES_IN_PROGRESS，防止重複領取
      - name: createOrder
        in: guildId, customerUserId, optionCode, assignedBy
        out: EscortDispatchOrder
        side: tx
        purpose: 建立 PENDING_CONFIRMATION 派遣單，含來源追蹤（MANUAL/CURRENCY_PURCHASE/FIAT_PAYMENT）
      - name: assignEscort
        in: orderNumber, escortUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 原子指派護航，WHERE status=PENDING_CONFIRMATION AND escort_user_id=0
      - name: confirmOrder
        in: orderNumber, escortUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 原子 PENDING_CONFIRMATION→CONFIRMED
      - name: requestCompletion
        in: orderNumber, escortUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 原子 CONFIRMED→PENDING_CUSTOMER_CONFIRMATION
      - name: customerConfirm
        in: orderNumber, customerUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 客戶確認完成 PENDING_CUSTOMER_CONFIRMATION→COMPLETED
      - name: requestAfterSales
        in: orderNumber, customerUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 客戶請求售後 (PENDING_CUSTOMER_CONFIRMATION 或 COMPLETED)→AFTER_SALES_REQUESTED
      - name: closeAfterSales
        in: orderNumber, assigneeUserId
        out: Result<EscortDispatchOrder, DomainError>
        side: tx
        purpose: 原子 AFTER_SALES_IN_PROGRESS→AFTER_SALES_CLOSED，驗權 assignee
      - name: ensureTimeoutCompletion
        in: EscortDispatchOrder
        out: EscortDispatchOrder
        side: pure
        purpose: 檢查 PENDING_CUSTOMER_CONFIRMATION 是否超過 24h 自動完成
    variables:
      - name: dispatchOrder
        type: EscortDispatchOrder
        scope: persist
        purpose: 含 7 階段狀態機與來源追蹤，原子狀態轉換使用 RETURNING 樂觀鎖
      - name: afterSalesStaff
        type: Set<Long>
        scope: persist
        purpose: guild 售後人員 user ID 集合，用於售後案件派發
      - name: escortOptionPriceOverride
        type: Map<String, Long>
        scope: persist
        purpose: 'guild 級護航選項定價覆寫（default: 目錄價格）'
    dataflow:
      - step: 手動/HANDOFF 建立訂單 → INSERT escort_dispatch_order (PENDING_CONFIRMATION)
        fn: createOrder
        writes:
          - dispatchOrder
      - step: 狀態機流轉：每步驗證當前狀態與呼叫者身份 → UPDATE ... WHERE status=X RETURNING *
        fn: assignEscort
        writes:
          - dispatchOrder
      - step: >-
          handoffFromCurrencyPurchase / handoffFromFiatPayment：先去重 findBySourceIdentity→不存在則
          createAutoHandoff
        fn: handoffFromFiatPayment
        writes:
          - dispatchOrder
      - step: 讀取時檢查自動超時：ensureTimeoutCompletion 檢查 24h 閾值→如逾期則自動完成
        fn: ensureTimeoutCompletion
        reads:
          - dispatchOrder
    errors:
      - name: ErrInvalidStateTransition
        when: 狀態不合法（如 COMPLETED 不能直接 claim after-sales）或權限不符
        means: 回傳 DomainError，操作被拒絕
  - slug: dispatch-db
    kind: db
    role: escort_dispatch_order / guild_escort_option_price / dispatch_after_sales_staff 資料表
    functions:
      - name: INSERT_order
        in: EscortDispatchOrder
        out: Long id
        side: write
        purpose: 寫入派遣訂單
      - name: atomic_state_transition
        in: orderNumber, fromStatus, toStatus
        out: EscortDispatchOrder | empty
        side: tx
        purpose: 原子狀態轉換 UPDATE ... WHERE status=X RETURNING *
      - name: SELECT_pending_by_guild
        in: guildId
        out: List<EscortDispatchOrder>
        side: io
        purpose: 查詢 guild 內待指派的訂單
    variables:
      - name: escort_dispatch_order
        type: table
        scope: persist
        purpose: 派遣訂單表：23 欄位含 7 階段狀態機＋來源追蹤＋時間戳
      - name: guild_escort_option_price
        type: table
        scope: persist
        purpose: guild 級護航選項定價覆寫表
      - name: dispatch_after_sales_staff
        type: table
        scope: persist
        purpose: 售後人員 user_id 表，guild 範圍
    dataflow: []
    errors:
      - name: ErrConcurrentStateModification
        when: UPDATE ... WHERE status=X RETURNING * 回傳 0 列（狀態已被其他請求變更）
        means: 回傳 DomainError，呼叫方重試或提示使用者
edges:
  - id: e-bacx43
    from: dispatch-interaction
    to: dispatch-service
    kind: call
    label: 委派派遣業務
  - id: e-m19qs9
    from: dispatch-service
    to: dispatch-db
    kind: call
    label: 讀寫派遣訂單
  - id: e-gw9gav
    from: dispatch-service
    to: dispatch-interaction
    kind: failure
    label: ErrInvalidStateTransition 回傳，操作被拒絕
