slug: membership-tiers
title: Membership Tiers
story: 全域 Discord User ID 會員等級：護航法幣消費評級、結算日重算、付款折扣、贈幣與個人面板展示。
dependsOn: []
submodules:
  - slug: tier-config
    kind: pure-fn
    role: 等級常數、MembershipTierEvaluator 純函式判定
    functions:
      - name: resolveTier
        in: avgListPriceM, hasQualifyingBronzeOrder
        out: MembershipTier
        side: pure
        purpose: 依週期平均 M 判定等級
    variables: []
    dataflow: []
    errors: []
  - slug: membership-db
    kind: db
    role: global_member_membership 主表與 repository
    functions:
      - name: findOrCreate
        in: discordUserId
        out: GlobalMemberMembership
        side: tx
        purpose: 全域會員主檔 findOrCreate
    variables: []
    dataflow: []
    errors: []
  - slug: join-tracking
    kind: api
    role: GuildMemberJoin 監聽、最早加入日與結算錨點
    functions:
      - name: onMemberJoin
        in: userId, joinedAt
        out: void
        side: write
        purpose: 記錄最早加入日與 next_settlement_at
    variables: []
    dataflow: []
    errors: []
  - slug: spend-ledger
    kind: service
    role: 法幣護航付款 M 寫入 spend entry
    functions:
      - name: recordFiatEscortPayment
        in: FiatOrder, Product
        out: void
        side: tx
        purpose: 付款成功寫入 catalog 原價 M
    variables: []
    dataflow: []
    errors: []
  - slug: settlement
    kind: service
    role: 結算排程、月平均 M、等級重算
    functions:
      - name: settle
        in: discordUserId
        out: void
        side: tx
        purpose: 結算週期重算 tier
    variables: []
    dataflow: []
    errors: []
  - slug: payment-discount
    kind: service
    role: MembershipPricingService 付款折扣
    functions:
      - name: quote
        in: userId, Product
        out: EscortPriceQuote
        side: io
        purpose: 護航商品會員折後價
    variables: []
    dataflow: []
    errors: []
  - slug: benefits-ui
    kind: ui
    role: 結算贈幣 + user-panel 等級展示
    functions:
      - name: grantForSettlement
        in: userId, periodEnd, tier
        out: void
        side: tx
        purpose: 結算日發放贈幣
    variables: []
    dataflow: []
    errors: []
edges: []
