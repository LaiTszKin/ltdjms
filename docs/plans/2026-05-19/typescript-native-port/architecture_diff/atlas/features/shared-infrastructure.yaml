slug: shared-infrastructure
title: Shared Infrastructure
story: 提供基礎設施服務給所有業務模組：Discord JDA 抽象層、領域事件系統、Redis 快取、Dagger DI 容器、共用結果型別。
dependsOn: []
submodules:
  - slug: discord-api
    kind: external
    role: Discord.js 抽象層：domain 介面、discord.js adapter、mock 實作、Embed/Button/SelectMenu 工具 (替代 JDA)
    functions:
      - name: sendMessage
        in: channelId, message
        out: Message
        side: network
        purpose: 發送 Discord 頻道訊息
      - name: sendDM
        in: userId, message
        out: Message
        side: network
        purpose: 發送 Discord 私訊
      - name: createEmbed
        in: title, description, color
        out: EmbedBuilder
        side: pure
        purpose: 建立 Discord Embed 構建器
      - name: createButton
        in: id, label, style
        out: Button
        side: pure
        purpose: 建立 Discord 按鈕元件
      - name: createSelectMenu
        in: id, options[]
        out: SelectMenu
        side: pure
        purpose: 建立 Discord 選單元件
    variables: []
    dataflow: []
    errors:
      - name: ErrMessageTooLong
        when: 訊息超過 Discord 2000 字元限制（頁化前）
        means: 由 DiscordMarkdownPaginator 處理，不在本層拋出
      - name: ErrRateLimited
        when: Discord API 回傳 429 Rate Limit
        means: 由 JDA 內部退避處理，呼叫方不需處理
  - slug: event-bus
    kind: service
    role: 同步領域事件匯流排：EventEmitter-based DomainEventPublisher (替代 CopyOnWriteArrayList Consumer)
    functions:
      - name: publish
        in: DomainEvent
        out: void
        side: io
        purpose: 同步發佈領域事件至所有已註冊 Consumer
      - name: register
        in: Class<DomainEvent>, Consumer<DomainEvent>
        out: void
        side: io
        purpose: 註冊事件 Consumer，支援快取失效/面板更新/審計等監聽
    variables:
      - name: consumers
        type: Map<Class<?>, List<Consumer<?>>>
        scope: instance
        purpose: 事件類型→Consumer 列表映射，支援多個監聽器
    dataflow: []
    errors:
      - name: ErrConsumerUnhandled
        when: Consumer 處理事件時拋出未預期例外
        means: log error，不影響其他 Consumer 或發佈者（fire-and-forget）
  - slug: cache-layer
    kind: service
    role: Redis 快取抽象 (ioredis 替代 Lettuce)：CacheService 介面、RedisCacheService、NoOpCacheService
    functions:
      - name: get
        in: key
        out: Optional<T>
        side: io
        purpose: 讀取 Redis 快取
      - name: set
        in: key, value, ttl
        out: void
        side: write
        purpose: 寫入 Redis 快取含 TTL
      - name: invalidate
        in: key
        out: void
        side: write
        purpose: 失效特定快取鍵
    variables:
      - name: cacheEntry
        type: Redis entry
        scope: instance
        purpose: 快取條目：key-value + TTL，餘額 300s / Agent 設定 3600s
    dataflow: []
    errors:
      - name: ErrCacheUnavailable
        when: Redis 連線中斷
        means: 降級為直接查詢資料庫，log warning，恢復後繼續使用快取
  - slug: di-container
    kind: service
    role: tsyringe 依賴注入容器 (替代 Dagger)：@singleton/@inject 裝飾器、container.resolve
    functions: []
    variables: []
    dataflow: []
    errors:
      - name: ErrComponentNotBound
        when: Dagger 無法解析依賴（未在 Module 中提供）
        means: 啟動時拋出 RuntimeException，不應發生於執行期
  - slug: di
    kind: service
    role: DI container (tsyringe, 替代 Dagger)
    functions: []
    variables: []
    dataflow: []
    errors: []
  - slug: database
    kind: service
    role: Drizzle ORM + node-postgres 資料庫層 (替代 JOOQ/JDBC/HikariCP/Flyway)：連線池、migration runner、schema 定義
    functions: []
    variables: []
    dataflow: []
    errors: []
  - slug: config
    kind: service
    role: Zod + dotenv 組態管理 (替代 Typesafe Config)：EnvironmentConfig、env loader、schema validation
    functions: []
    variables: []
    dataflow: []
    errors: []
  - slug: logging
    kind: service
    role: pino 結構化日誌 (替代 SLF4J/Logback)：JSON 輸出、child logger、level 控制
    functions: []
    variables: []
    dataflow: []
    errors: []
  - slug: types
    kind: pure-fn
    role: 核心型別系統：Result<T,E>、DomainError (27 categories)、DomainEvent (12 types)
    functions: []
    variables: []
    dataflow: []
    errors: []
edges:
  - id: e-1lx4cy
    from: event-bus
    to: cache-layer
    kind: call
    label: AgentConfigCacheInvalidationListener 監聽變更事件→失效快取
