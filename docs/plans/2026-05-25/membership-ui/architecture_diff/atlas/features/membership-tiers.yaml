slug: membership-tiers
title: Membership Tiers
story: 全域 Discord User ID 會員等級：護航法幣消費評級、結算日重算、付款折扣、贈幣與個人面板展示。
dependsOn: []
submodules:
  - slug: tier-config
    kind: pure-fn
    role: 等級常數、MembershipTierEvaluator 純函式判定
    functions:
      - name: resolveTier
        in: avgListPriceM, hasQualifyingBronzeOrder
        out: MembershipTier
        side: pure
        purpose: 依週期平均 M 判定等級
    variables: []
    dataflow: []
    errors: []
  - slug: membership-db
    kind: db
    role: global_member_membership 主表與 repository
    functions:
      - name: findOrCreate
        in: discordUserId
        out: GlobalMemberMembership
        side: tx
        purpose: 全域會員主檔 findOrCreate
    variables: []
    dataflow: []
    errors: []
  - slug: join-tracking
    kind: api
    role: GuildMemberJoin 監聽、最早加入日與結算錨點
    functions:
      - name: onMemberJoin
        in: userId, joinedAt
        out: void
        side: write
        purpose: 記錄最早加入日與 next_settlement_at
    variables: []
    dataflow: []
    errors: []
  - slug: spend-ledger
    kind: service
    role: 法幣護航付款 M 寫入 spend entry
    functions:
      - name: recordFiatEscortPayment
        in: FiatOrder, Product
        out: void
        side: tx
        purpose: 付款成功寫入 catalog 原價 M
    variables: []
    dataflow: []
    errors: []
  - slug: settlement
    kind: service
    role: 結算排程、月平均 M、等級重算
    functions:
      - name: settle
        in: discordUserId
        out: void
        side: tx
        purpose: 結算週期重算 tier
    variables: []
    dataflow: []
    errors: []
  - slug: payment-discount
    kind: service
    role: MembershipPricingService 付款折扣
    functions:
      - name: quote
        in: userId, Product
        out: EscortPriceQuote
        side: io
        purpose: 護航商品會員折後價
      - name: quoteEscortPrices
        in: userId,products,guildId
        out: Map<Long,EscortPriceQuote>
        side: io
        purpose: Batch quote for shop list page
      - name: formatEmbedPriceLine
        in: EscortPriceQuote
        out: markdownLine
        side: pure
        purpose: Strikethrough original + discount rate
    variables:
      - name: EscortPriceQuote
        type: record
        scope: call
    dataflow: []
    errors: []
  - slug: benefits-ui
    kind: ui
    role: 結算贈幣 + user-panel 等級展示
    functions:
      - name: grantForSettlement
        in: userId, periodEnd, tier
        out: void
        side: tx
        purpose: 結算日發放贈幣
      - name: getPanelSummaryExtended
        in: userId
        out: MembershipPanelSummary
        side: io
        purpose: 'R1-R3: join date, remaining M, monthly token grant'
    variables:
      - name: MembershipPanelSummary
        type: record
        scope: call
        purpose: Extended panel DTO
      - name: GlobalMemberMembership
        type: entity
        scope: call
      - name: periodSpendM
        type: long
        scope: call
    dataflow:
      - step: Load earliestGuildJoinAt and compute remainingToNextTierM
        fn: getPanelSummaryExtended
        reads:
          - GlobalMemberMembership
          - periodSpendM
        writes:
          - MembershipPanelSummary
    errors: []
  - slug: admin-membership
    kind: service
    role: MembershipAdminService 管理員調整 spend M 與 tier
    functions:
      - name: adjustPeriodSpend
        in: userId,guildId,adminUserId,mode,amountM
        out: void
        side: tx
        purpose: 'R2: ADMIN_ADJUST ledger insert'
      - name: setTier
        in: userId,adminUserId,newTier
        out: MembershipTier
        side: tx
        purpose: 'R3: update current_tier + publish event'
    variables:
      - name: ADMIN_ADJUST
        type: sourceType
        scope: tx
    dataflow: []
    errors: []
edges:
  - id: e-admin-spend
    from: admin-membership
    to: spend-ledger
    kind: call
    label: Insert ADMIN_ADJUST entry
  - id: e-admin-tier
    from: admin-membership
    to: membership-db
    kind: call
    label: Update current_tier
